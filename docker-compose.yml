services:
  proxy:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
    container_name: openai-router
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      CONFIG_PATH: /app/data/config.json
      WEBUI_USER: ""
      WEBUI_PASS: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
